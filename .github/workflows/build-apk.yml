name: Build SylphTools APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Run analyzer (non-blocking)
        run: flutter analyze || true

      - name: Build APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Rename APK with version
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          mv app-arm64-v8a-release.apk SylphTools-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SylphTools-apk
          path: build/app/outputs/flutter-apk/SylphTools-arm64-v8a.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/SylphTools-arm64-v8a.apk
          generate_release_notes: true
